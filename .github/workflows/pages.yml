name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publicar prototipo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar código
        uses: actions/checkout@v6

      - name: Comprobar archivos del sitio
        run: |
          test -s dist/index.html
          test -s dist/styles.css
          test -s dist/shared.css
          test -s dist/vendor/three.module.js
          test -s dist/vendor/OrbitControls.js
          test -s dist/vendor/RoundedBoxGeometry.js
          test -s dist/vendor/RoomEnvironment.js
          test -s dist/vendor/dm-sans.ttf
          test -s dist/noveno/index.html
          test -s dist/visita-real/index.html
          test -s dist/visita-real/photos/living.jpg
          for script in dist/*.js dist/noveno/*.js dist/visita-real/*.js; do node --check "$script"; done
          node --test tests/*.test.mjs

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar archivos públicos
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
